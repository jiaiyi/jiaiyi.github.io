<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{site_title}}">
<meta name="color-scheme" content="light dark">
<!-- pygments 在前、style 在后：让 style.css 的变量能覆盖代码块的默认底色 -->
<link rel="stylesheet" href="/static/pygments.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="alternate" type="application/rss+xml" title="RSS" href="/feed.xml">
<script>
/* 主题：优先用户选择，否则跟随系统；显式写入 data-theme 让 CSS 只需一种选择器 */
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body class="{{body_class}}">

<nav class="topnav">
  <a class="brand" href="/index.html">{{site_title}}</a>
  <span class="spacer"></span>
  <a class="nav-link" href="{{repo}}">Skills</a>
  <a class="nav-link" href="{{github}}">GitHub</a>
  <button id="theme-toggle" class="theme-toggle" type="button"
          aria-label="切换明暗主题" title="切换明暗主题">
    <span class="i-sun">☀</span><span class="i-moon">☾</span>
  </button>
</nav>

<main>
{{content}}
</main>

<footer>
  <p>© {{year}} {{site_title}}<span class="sep">·</span><a href="/feed.xml">RSS</a></p>
</footer>

<script>
/* 明暗主题切换（记忆偏好） */
(function () {
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
})();

/* 回到顶部：滚动超过一屏才出现 */
(function () {
  var b = document.getElementById('to-top');
  if (!b) return;
  var ticking = false;
  function update() {
    b.classList.toggle('show', window.scrollY > 520);
    ticking = false;
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
  update();
  b.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>

</body>
</html>
