name: Build blog

# 什么时候触发：
#   · 改动 posts/ templates/ static/ build.py 并推到 main
#   · 也可以在 Actions 页面手动点「Run workflow」
on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "templates/**"
      - "static/**"
      - "build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# 需要写权限才能把构建产物提交回仓库
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install markdown pygments

      - name: 构建站点
        run: python build.py

      - name: 提交构建产物
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "docs/ 没有变化，跳过提交"
          else
            git commit -m "chore: rebuild docs [skip ci]"
            git push
          fi
